name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Prepare Project Structure
        run: |
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/java/com/rocket/maxkiller
          
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml || true
          mv MainActivity.java app/src/main/java/com/rocket/maxkiller/ || true
          mv KillerService.java app/src/main/java/com/rocket/maxkiller/ || true
          
          echo '<?xml version="1.0" encoding="utf-8"?><accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" android:accessibilityEventTypes="typeWindowStateChanged" android:canRetrieveWindowContent="true" />' > app/src/main/res/xml/accessibility_config.xml
          
          echo 'plugins { id "com.android.application" }' > app/build.gradle
          echo 'android { namespace "com.rocket.maxkiller"; compileSdk 33; defaultConfig { applicationId "com.rocket.maxkiller"; minSdk 21; targetSdk 33; versionCode 1; versionName "1.0" } }' >> app/build.gradle
          echo 'include ":app"' > settings.gradle

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        
      - name: Build with Gradle
        run: gradle assembleDebug
        
      - uses: actions/upload-artifact@v4
        with:
          name: MaxKiller-APK
          path: app/build/outputs/apk/debug/app-debug.apk
